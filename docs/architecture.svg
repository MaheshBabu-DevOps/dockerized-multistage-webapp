" text-anchor="middle" font-size="15" font-weight="400" fill="#57606a">64 MB, LRU eviction</text><line x1="190" y1="285" x2="290" y2="285" stroke="#1f2328" stroke-width="3" marker-end="url(#a)"/><text x="240" y="270" text-anchor="middle" font-size="15" font-weight="400" fill="#57606a">HTTP</text><line x1="520" y1="285" x2="600" y2="285" stroke="#1f2328" stroke-width="3" marker-end="url(#a)"/><text x="560" y="270" text-anchor="middle" font-size="15" font-weight="400" fill="#57606a">/api/*</text><line x1="830" y1="255" x2="960" y2="200" stroke="#1f2328" stroke-width="3" marker-end="url(#a)"/><text x="905" y="215" text-anchor="middle" font-size="15" font-weight="400" fill="#57606a">SQL</text><line x1="830" y1="310" x2="960" y2="365" stroke="#1f2328" stroke-width="3" marker-end="url(#a)"/><text x="875" y="372" text-anchor="middle" font-size="15" font-weight="400" fill="#57606a">cache</text><text x="640" y="562" text-anchor="middle" font-size="16" font-weight="400" fill="#57606a">GET /api/notes checks Redis first (X-Cache: HIT). On a miss it reads PostgreSQL and stores the result in Redis for 30 seconds.</text><text x="640" y="588" text-anchor="middle" font-size="16" font-weight="400" fill="#57606a">POST and DELETE write to PostgreSQL and clear the cached list. If Redis is down, the API falls back to the database.</text></svg>