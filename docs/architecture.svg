<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" font-family="Inter, Segoe UI, Arial, sans-serif" role="img" aria-label="Runtime architecture: browser, Nginx and React, FastAPI, PostgreSQL and Redis"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs><rect width="1100" height="520" fill="#0d1117"/><text x="550" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#e6edf3">Runtime architecture (Docker Compose)</text><rect x="30" y="190" width="150" height="120" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/><text x="105.0" y="220" text-anchor="middle" font-size="17" font-weight="700" fill="#58a6ff">Browser</text><text x="105.0" y="246" text-anchor="middle" font-size="13" fill="#8b949e">User opens</text><text x="105.0" y="266" text-anchor="middle" font-size="13" fill="#8b949e">http://localhost:8080</text><rect x="250" y="150" width="220" height="200" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/><text x="360.0" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#3fb950">frontend</text><text x="360.0" y="206" text-anchor="middle" font-size="13" fill="#8b949e">Nginx (unprivileged)</text><text x="360.0" y="226" text-anchor="middle" font-size="13" fill="#8b949e">serves the React build</text><text x="360.0" y="246" text-anchor="middle" font-size="13" fill="#8b949e">proxies /api to backend</text><text x="360.0" y="266" text-anchor="middle" font-size="13" fill="#8b949e">port 8080</text><rect x="540" y="150" width="220" height="200" rx="12" fill="#161b22" stroke="#d29922" stroke-width="1.6"/><text x="650.0" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#d29922">backend</text><text x="650.0" y="206" text-anchor="middle" font-size="13" fill="#8b949e">FastAPI + Gunicorn</text><text x="650.0" y="226" text-anchor="middle" font-size="13" fill="#8b949e">REST API: /api/notes</text><text x="650.0" y="246" text-anchor="middle" font-size="13" fill="#8b949e">/api/health</text><text x="650.0" y="266" text-anchor="middle" font-size="13" fill="#8b949e">port 8000</text><rect x="840" y="90" width="220" height="130" rx="12" fill="#161b22" stroke="#bc8cff" stroke-width="1.6"/><text x="950.0" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#bc8cff">db</text><text x="950.0" y="146" text-anchor="middle" font-size="13" fill="#8b949e">PostgreSQL 16</text><text x="950.0" y="166" text-anchor="middle" font-size="13" fill="#8b949e">named volume: pgdata</text><rect x="840" y="290" width="220" height="130" rx="12" fill="#161b22" stroke="#f85149" stroke-width="1.6"/><text x="950.0" y="320" text-anchor="middle" font-size="17" font-weight="700" fill="#f85149">redis</text><text x="950.0" y="346" text-anchor="middle" font-size="13" fill="#8b949e">Redis 7 (cache)</text><text x="950.0" y="366" text-anchor="middle" font-size="13" fill="#8b949e">64 MB, LRU eviction</text><line x1="180" y1="250" x2="250" y2="250" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><text x="215" y="240" text-anchor="middle" font-size="12" font-weight="400" fill="#8b949e">HTTP</text><line x1="470" y1="250" x2="540" y2="250" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><text x="505" y="240" text-anchor="middle" font-size="12" font-weight="400" fill="#8b949e">/api/*</text><line x1="760" y1="200" x2="840" y2="155" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><text x="800" y="160" text-anchor="middle" font-size="12" font-weight="400" fill="#8b949e">SQL</text><line x1="760" y1="300" x2="840" y2="350" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><text x="800" y="345" text-anchor="middle" font-size="12" font-weight="400" fill="#8b949e">cache</text><rect x="215" y="62" width="878" height="392" rx="12" fill="none" stroke="#30363d" stroke-width="1.6" stroke-dasharray="6 5"/><text x="235" y="86" text-anchor="start" font-size="12" font-weight="400" fill="#8b949e">Docker Compose network</text><text x="550" y="478" text-anchor="middle" font-size="13" font-weight="400" fill="#8b949e">GET /api/notes: check Redis first (X-Cache: HIT). On a miss, read PostgreSQL, store in Redis (30 s TTL).</text><text x="550" y="500" text-anchor="middle" font-size="13" font-weight="400" fill="#8b949e">Writes (POST, DELETE) save to PostgreSQL and delete the cached list. If Redis is down, the API falls back to the database.</text></svg>