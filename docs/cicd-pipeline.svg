<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" font-family="Inter, Segoe UI, Arial, sans-serif" role="img" aria-label="CI/CD pipeline: push to GitHub triggers GitHub Actions tests, then build and push to Docker Hub"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs><rect width="1100" height="470" fill="#0d1117"/><text x="550" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#e6edf3">CI/CD pipeline (GitHub Actions)</text><rect x="30" y="170" width="150" height="110" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/><text x="105.0" y="200" text-anchor="middle" font-size="17" font-weight="700" fill="#58a6ff">Developer</text><text x="105.0" y="226" text-anchor="middle" font-size="13" fill="#8b949e">git push</text><rect x="250" y="170" width="160" height="110" rx="12" fill="#161b22" stroke="#e6edf3" stroke-width="1.6"/><text x="330.0" y="200" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">GitHub</text><text x="330.0" y="226" text-anchor="middle" font-size="13" fill="#8b949e">main branch</text><text x="330.0" y="246" text-anchor="middle" font-size="13" fill="#8b949e">pull requests</text><line x1="180" y1="225" x2="250" y2="225" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><text x="215" y="215" text-anchor="middle" font-size="12" font-weight="400" fill="#8b949e">push</text><rect x="470" y="90" width="360" height="300" rx="12" fill="none" stroke="#30363d" stroke-width="1.6" stroke-dasharray="6 5"/><text x="490" y="116" text-anchor="start" font-size="12" font-weight="400" fill="#8b949e">GitHub Actions</text><rect x="490" y="135" width="150" height="90" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/><text x="565.0" y="165" text-anchor="middle" font-size="17" font-weight="700" fill="#3fb950">backend-test</text><text x="565.0" y="191" text-anchor="middle" font-size="13" fill="#8b949e">ruff + pytest</text><rect x="490" y="255" width="150" height="90" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/><text x="565.0" y="285" text-anchor="middle" font-size="17" font-weight="700" fill="#3fb950">frontend-test</text><text x="565.0" y="311" text-anchor="middle" font-size="13" fill="#8b949e">vitest + build</text><rect x="680" y="190" width="130" height="90" rx="12" fill="#161b22" stroke="#d29922" stroke-width="1.6"/><text x="745.0" y="220" text-anchor="middle" font-size="17" font-weight="700" fill="#d29922">build + push</text><text x="745.0" y="246" text-anchor="middle" font-size="13" fill="#8b949e">main only</text><line x1="410" y1="225" x2="470" y2="225" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><text x="440" y="212" text-anchor="middle" font-size="12" font-weight="400" fill="#8b949e">trigger</text><line x1="640" y1="180" x2="680" y2="225" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><line x1="640" y1="300" x2="680" y2="245" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><rect x="890" y="170" width="180" height="110" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/><text x="980.0" y="200" text-anchor="middle" font-size="17" font-weight="700" fill="#58a6ff">Docker Hub</text><text x="980.0" y="226" text-anchor="middle" font-size="13" fill="#8b949e">notes-backend</text><text x="980.0" y="246" text-anchor="middle" font-size="13" fill="#8b949e">notes-frontend</text><line x1="810" y1="235" x2="890" y2="225" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><text x="850" y="215" text-anchor="middle" font-size="12" font-weight="400" fill="#8b949e">push</text><text x="550" y="425" text-anchor="middle" font-size="13" font-weight="400" fill="#8b949e">Both test jobs run in parallel. The image build starts only if both pass, and only on pushes to main.</text><text x="550" y="447" text-anchor="middle" font-size="13" font-weight="400" fill="#8b949e">Images are tagged latest and with the commit SHA. Docker Hub credentials come from repository secrets.</text></svg>